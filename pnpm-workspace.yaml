packages:
  - apps/*
  - packages/*
  - configs/*
  - scripts

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600

allowBuilds:
  esbuild: true

catalog:
  '@types/node': ^24.12.0
  eslint: ^10.5.0
  tsx: ^4.23.0
  typescript: ^6.0.3
  vitest: ^4.1.8
  zod: ^4.3.6
